
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Money Bank</title>
<style>
:root {
  --blue:#648ce8;
  --green:#69c6b1;
  --pink:#e99aaa;
  --bg:#f5f7fc;
  --text:#303b50;
  --muted:#8994a8;
  --line:#e8edf5;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
}
header {
  padding:25px 20px;
  color:white;
  background:linear-gradient(120deg,#7198ed,#82cfc0);
}
header h1 { margin:0 0 8px; font-size:24px; }
header p { margin:0; opacity:.9; font-size:13px; }
main { max-width:850px; margin:auto; padding:18px; }
.card {
  background:white;
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 5px 20px #34496a08;
}
h2 { font-size:18px; margin:0 0 15px; }
h3 { font-size:14px; margin:0 0 8px; }
.balance {
  font-size:32px;
  font-weight:750;
  margin:8px 0;
}
.stats {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.stat {
  background:#f7f9ff;
  padding:14px;
  border-radius:14px;
}
.stat strong { display:block; font-size:20px; margin-top:6px; }
small,.muted { color:var(--muted); }
label { display:block; font-size:13px; margin-bottom:6px; }
input,select {
  width:100%;
  min-width:0;
  padding:12px;
  border:1px solid #dfe5ef;
  border-radius:11px;
  background:white;
  color:var(--text);
  font:inherit;
}
input:focus,select:focus {
  outline:2px solid #d7e4ff;
  border-color:var(--blue);
}
.grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}
.field { min-width:0; }
.full { grid-column:1/-1; }
button {
  border:0;
  border-radius:11px;
  padding:12px 16px;
  font:inherit;
  cursor:pointer;
}
.primary {
  width:100%;
  color:white;
  background:linear-gradient(110deg,#648ce8,#70c8b8);
  font-weight:650;
  margin-top:14px;
}
.secondary { background:#eef3ff; color:#5275c2; }
.delete { background:#fff0f2; color:#c55e76; padding:7px 10px; }
.preview {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:17px;
  border-radius:15px;
  background:linear-gradient(120deg,#edf3ff,#eaf9f4);
}
.preview strong {
  display:block;
  color:#477bd2;
  font-size:30px;
  margin:5px 0;
}
.preview small { display:block; }
.transaction {
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid var(--line);
}
.transaction:last-child { border-bottom:0; }
.tx-info { flex:1; min-width:0; }
.tx-info div { overflow-wrap:anywhere; }
.tx-info small { display:block; margin-top:4px; }
.amount { font-weight:700; white-space:nowrap; }
.income { color:#48ad91; }
.expense { color:#df8095; }
.goal { margin-top:15px; }
.goal-top {
  display:flex;
  justify-content:space-between;
  gap:10px;
}
progress { width:100%; height:10px; accent-color:var(--green); }
.actions { display:flex; flex-wrap:wrap; gap:8px; }
.actions button { flex:1; }
.notice { font-size:12px; line-height:1.7; color:var(--muted); }
@media(max-width:480px) {
  main { padding:12px; }
  .card { padding:16px; }
  .balance { font-size:28px; }
  .preview strong { font-size:26px; }
}
</style>
</head>
<body>

<header>
  <h1>✧ My Money Bank</h1>
  <p>お金の記録も、勉強のがんばりも。</p>
</header>

<main>
  <section class="card">
    <small>現在の残高</small>
    <div class="balance" id="balance">¥0</div>
    <div class="stats">
      <div class="stat">
        <small>今月の収入</small>
        <strong class="income" id="incomeTotal">¥0</strong>
      </div>
      <div class="stat">
        <small>今月の支出</small>
        <strong class="expense" id="expenseTotal">¥0</strong>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>🎓 勉強時間 → 報酬</h2>
    <p class="notice">1分＝5円で計算。時間と分を入力すると金額が自動で変わるよ。</p>

    <form id="studyForm">
      <div class="grid">
        <div class="field">
          <label for="studyHours">時間</label>
          <input id="studyHours" type="number" min="0" max="24" step="1" placeholder="1">
        </div>
        <div class="field">
          <label for="studyMinutes">分</label>
          <input id="studyMinutes" type="number" min="0" max="59" step="1" placeholder="30">
        </div>

        <div class="field full">
          <div class="preview">
            <div>
              <small>いまの換金額</small>
              <strong id="rewardPreview">¥0</strong>
              <small id="timePreview">勉強時間を入力してね</small>
            </div>
            <span style="font-size:25px">→ ✨</span>
          </div>
        </div>

        <div class="field full">
          <label for="studyDate">勉強した日</label>
          <input id="studyDate" type="date" required>
        </div>
      </div>
      <button class="primary" type="submit">この金額で報酬を記録する</button>
    </form>
  </section>

  <section class="card">
    <h2>💰 収入・支出を記録</h2>
    <form id="moneyForm">
      <div class="grid">
        <div class="field">
          <label for="kind">種類</label>
          <select id="kind">
            <option value="income">収入</option>
            <option value="expense">支出</option>
          </select>
        </div>
        <div class="field">
          <label for="category">カテゴリ</label>
          <select id="category">
            <option>その他</option>
            <option>おこづかい</option>
            <option>勉強報酬</option>
            <option>プレゼント</option>
            <option>食費</option>
            <option>買い物</option>
            <option>交通費</option>
            <option>趣味</option>
            <option>学校</option>
          </select>
        </div>
        <div class="field full">
          <label for="title">内容</label>
          <input id="title" maxlength="70" placeholder="例：おこづかい" required>
        </div>
        <div class="field">
          <label for="amount">金額（円）</label>
          <input id="amount" type="number" min="1" step="1" placeholder="1000" required>
        </div>
        <div class="field">
          <label for="date">日付</label>
          <input id="date" type="date" required>
        </div>
      </div>
      <button class="primary" type="submit">＋ 記録を追加</button>
    </form>
  </section>

  <section class="card">
    <h2>🎯 貯金の目標</h2>
    <form id="goalForm">
      <div class="grid">
        <div class="field">
          <label for="goalName">目標名</label>
          <input id="goalName" placeholder="例：イヤホン" required>
        </div>
        <div class="field">
          <label for="goalAmount">目標金額（円）</label>
          <input id="goalAmount" type="number" min="1" placeholder="10000" required>
        </div>
      </div>
      <button class="primary" type="submit">目標を追加</button>
    </form>
    <div id="goals"></div>
  </section>

  <section class="card">
    <h2>🧾 最近の記録</h2>
    <div id="transactions"><p class="notice">まだ記録がありません。</p></div>
  </section>

  <section class="card">
    <h2>データ管理</h2>
    <div class="actions">
      <button class="secondary" id="exportBtn">JSONで保存</button>
      <button class="secondary" id="importBtn">バックアップ読込</button>
      <button class="secondary" id="csvBtn">CSV出力</button>
      <input id="importFile" type="file" accept=".json,application/json" hidden>
    </div>
    <p class="notice">記録はこのブラウザに保存されます。端末を変える前にバックアップしてね。</p>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = 'my-money-bank-data-v1';
  const today = () => {
    const d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth()+1).padStart(2,'0') + '-' +
      String(d.getDate()).padStart(2,'0');
  };
  const yen = n => '¥' + Math.round(n || 0).toLocaleString('ja-JP');

  let data = { transactions: [], goals: [] };

  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && Array.isArray(saved.transactions) && Array.isArray(saved.goals)) {
      data = saved;
    }
  } catch (_) {}

  function save() {
    localStorage.setItem(KEY, JSON.stringify(data));
  }

  function updateReward() {
    const h = Number($('studyHours').value || 0);
    const m = Number($('studyMinutes').value || 0);
    const valid = Number.isInteger(h) && Number.isInteger(m) &&
      h >= 0 && h <= 24 && m >= 0 && m <= 59 &&
      !(h === 24 && m > 0);

    if (!valid) {
      $('rewardPreview').textContent = '入力を確認';
      $('timePreview').textContent = '時間は0〜24、分は0〜59で入力してね';
      return;
    }

    const total = h * 60 + m;
    $('rewardPreview').textContent = yen(total * 5);
    $('timePreview').textContent = total
      ? `${h ? h + '時間' : ''}${m ? m + '分' : ''} × 5円`
      : '勉強時間を入力してね';
  }

  $('studyHours').addEventListener('input', updateReward);
  $('studyMinutes').addEventListener('input', updateReward);

  $('studyForm').addEventListener('submit', e => {
    e.preventDefault();
    const h = Number($('studyHours').value || 0);
    const m = Number($('studyMinutes').value || 0);
    const date = $('studyDate').value;

    if (!Number.isInteger(h) || !Number.isInteger(m) ||
        h < 0 || h > 24 || m < 0 || m > 59 ||
        (h === 24 && m > 0) || h * 60 + m <= 0 || !date) {
      alert('勉強時間と日付を確認してね。');
      return;
    }

    const total = h * 60 + m;
    data.transactions.push({
      id: Date.now() + Math.random(),
      type: 'income',
      title: `勉強報酬（${h ? h + '時間' : ''}${m ? m + '分' : ''}）`,
      amount: total * 5,
      date,
      category: '勉強報酬',
      minutes: total
    });

    save();
    render();
    $('studyForm').reset();
    $('studyDate').value = today();
    updateReward();
  });

  $('moneyForm').addEventListener('submit', e => {
    e.preventDefault();
    const title = $('title').value.trim();
    const amount = Number($('amount').value);
    const date = $('date').value;

    if (!title || !Number.isFinite(amount) || amount <= 0 || !date) {
      alert('内容、金額、日付を確認してね。');
      return;
    }

    data.transactions.push({
      id: Date.now() + Math.random(),
      type: $('kind').value,
      title,
      amount: Math.round(amount),
      date,
      category: $('category').value
    });

    save();
    render();
    $('moneyForm').reset();
    $('date').value = today();
  });

  $('goalForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('goalName').value.trim();
    const amount = Number($('goalAmount').value);
    if (!name || !Number.isFinite(amount) || amount <= 0) return;

    data.goals.push({
      id: Date.now() + Math.random(),
      name,
      amount: Math.round(amount)
    });
    save();
    render();
    $('goalForm').reset();
  });

  function safe(text) {
    return String(text ?? '').replace(/[&<>"']/g, c => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;',
      '"':'&quot;', "'":'&#39;'
    })[c]);
  }

  function render() {
    const month = today().slice(0,7);
    const monthRows = data.transactions.filter(t => t.date.startsWith(month));
    const income = monthRows.filter(t => t.type === 'income')
      .reduce((s,t) => s + t.amount, 0);
    const expense = monthRows.filter(t => t.type === 'expense')
      .reduce((s,t) => s + t.amount, 0);
    const balance = data.transactions.reduce((s,t) =>
      s + (t.type === 'income' ? t.amount : -t.amount), 0);

    $('balance').textContent = yen(balance);
    $('incomeTotal').textContent = yen(income);
    $('expenseTotal').textContent = yen(expense);

    const rows = [...data.transactions].sort((a,b) =>
      (b.date || '').localeCompare(a.date || ''));

    $('transactions').innerHTML = rows.length ? rows.map(t => `
      <div class="transaction">
        <div class="tx-info">
          <div>${safe(t.title)}</div>
          <small>${safe(t.date)} ・ ${safe(t.category || 'その他')}</small>
        </div>
        <div class="amount ${t.type}">
          ${t.type === 'income' ? '+' : '−'}${yen(t.amount)}
        </div>
        <button class="delete" data-delete="${t.id}">削除</button>
      </div>
    `).join('') : '<p class="notice">まだ記録がありません。</p>';

    $('transactions').querySelectorAll('[data-delete]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!confirm('この記録を削除する？')) return;
        data.transactions = data.transactions.filter(
          t => String(t.id) !== btn.dataset.delete
        );
        save();
        render();
      });
    });

    $('goals').innerHTML = data.goals.length ? data.goals.map(g => {
      const percent = Math.max(0, Math.min(100, balance / g.amount * 100));
      return `
        <div class="goal">
          <div class="goal-top">
            <strong>${safe(g.name)}</strong>
            <span>${Math.round(percent)}%</span>
          </div>
          <small>${yen(Math.max(0,balance))} / ${yen(g.amount)}</small>
          <progress max="100" value="${percent}"></progress>
          <button class="delete" data-goal="${g.id}">目標を削除</button>
        </div>`;
    }).join('') : '<p class="notice">貯金目標を追加してみよう。</p>';

    $('goals').querySelectorAll('[data-goal]').forEach(btn => {
      btn.addEventListener('click', () => {
        data.goals = data.goals.filter(g => String(g.id) !== btn.dataset.goal);
        save();
        render();
      });
    });
  }

  function download(name, content, type) {
    const blob = new Blob([content], {type});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  $('exportBtn').addEventListener('click', () => {
    download('money-backup.json', JSON.stringify(data, null, 2),
      'application/json');
  });

  $('importBtn').addEventListener('click', () => $('importFile').click());

  $('importFile').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const imported = JSON.parse(await file.text());
      if (!Array.isArray(imported.transactions) ||
          !Array.isArray(imported.goals)) throw Error();
      if (!confirm('現在の記録をバックアップの内容に置き換える？')) return;
      data = imported;
      save();
      render();
      alert('バックアップを読み込んだよ！');
    } catch (_) {
      alert('読み込めないファイルだよ。');
    } finally {
      e.target.value = '';
    }
  });

  $('csvBtn').addEventListener('click', () => {
    const rows = [
      ['日付','種類','内容','金額','カテゴリ'],
      ...data.transactions.map(t => [
        t.date, t.type === 'income' ? '収入' : '支出',
        t.title, t.amount, t.category || ''
      ])
    ];
    const csv = rows.map(row =>
      row.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',')
    ).join('\r\n');
    download('money-records.csv', '\uFEFF' + csv, 'text/csv;charset=utf-8');
  });

  $('date').value = today();
  $('studyDate').value = today();
  updateReward();
  render();
})();
</script>
</body>
</html>
